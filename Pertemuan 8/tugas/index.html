<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran Kursus</title>
  <!-- Menghubungkan CSS Eksternal -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="form-card">
      <header class="form-header">
        <span class="label-top">PENDAFTARAN KURSUS</span>
        <h1>Form Pendaftaran</h1>
        <p>Silakan isi formulir di bawah ini dengan lengkap dan benar.</p>
        <p class="required-info">* Wajib diisi</p>
      </header>

      <form id="courseForm" action="#" method="POST" enctype="multipart/form-data" novalidate>
        
        <!-- Text Input (Validasi minlength) -->
        <div class="form-group">
          <label for="nama">Nama Lengkap *</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required minlength="3">
          <small>Minimal 3 karakter.</small>
        </div>

        <!-- Email Input (Validasi tipe email) -->
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
        </div>

        <!-- Tel Input (Validasi pattern angka 10-13 digit) -->
        <div class="form-group">
          <label for="telepon">Nomor Telepon/WA *</label>
          <input type="tel" id="telepon" name="telepon" placeholder="081234567890" pattern="^[0-9]{10,13}$" required>
          <small>Hanya angka, 10 hingga 13 digit.</small>
        </div>

        <!-- Select Field -->
        <div class="form-group">
          <label for="kursus">Pilih Kursus *</label>
          <select id="kursus" name="kursus" required>
            <option value="" disabled selected>-- Pilih Jenis Kursus --</option>
            <option value="web">Web Development</option>
            <option value="mobile">Mobile App Development</option>
            <option value="uiux">UI/UX Design</option>
            <option value="data">Data Science</option>
          </select>
        </div>

        <!-- Radio Group -->
        <fieldset>
          <legend>Metode Pembelajaran *</legend>
          <div class="option">
            <input type="radio" id="online" name="metode" value="Online" checked required>
            <label for="online">Online (Remote)</label>
          </div>
          <div class="option">
            <input type="radio" id="offline" name="metode" value="Offline">
            <label for="offline">Offline (Tatap Muka)</label>
          </div>
        </fieldset>

        <!-- Checkbox Options -->
        <fieldset>
          <legend>Jadwal Belajar (Checkbox)</legend>
          <div class="option">
            <input type="checkbox" id="pagi" name="jadwal[]" value="Pagi">
            <label for="pagi">Pagi (09.00 - 12.00)</label>
          </div>
          <div class="option">
            <input type="checkbox" id="siang" name="jadwal[]" value="Siang">
            <label for="siang">Siang (13.00 - 16.00)</label>
          </div>
          <div class="option">
            <input type="checkbox" id="malam" name="jadwal[]" value="Malam">
            <label for="malam">Malam (19.00 - 21.00)</label>
          </div>
        </fieldset>

        <!-- Upload Pembayaran -->
        <div class="form-group">
          <label for="bukti">Upload Bukti Pembayaran (Max 2MB) *</label>
          <input type="file" id="bukti" name="bukti" accept=".jpg,.jpeg,.png,.pdf" required>
          <span class="instruction">Format yang diterima: JPG, PNG, PDF.</span>
        </div>

        <!-- Textarea -->
        <div class="form-group">
          <label for="catatan">Catatan / Alasan Mengikuti Kursus</label>
          <textarea id="catatan" name="catatan" placeholder="Tuliskan catatan tambahan jika ada..."></textarea>
        </div>

        <!-- Agreement -->
        <div class="agreement">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">Saya menyetujui syarat dan ketentuan yang berlaku. *</label>
        </div>

        <!-- 3 Jenis Button -->
        <div class="button-group">
          <button type="submit" class="btn btn-primary">Daftar Sekarang</button>
          <button type="button" class="btn btn-secondary" onclick="alert('Draft berhasil disimpan!')">Simpan Draft</button>
          <button type="reset" class="btn btn-danger">Reset Form</button>
        </div>

      </form>
    </div>
  </main>
</body>
</html>
